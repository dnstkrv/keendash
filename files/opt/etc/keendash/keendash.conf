# keendash settings (the only config file). Shell syntax. After editing:
#   /opt/etc/init.d/S81keendash restart

# TCP port of keendash's own web server (CGI status + widget scripts).
PORT=8189

# Network interface to take the router's LAN address from (Keenetic: br0 = "Home" segment).
# Several interfaces can be listed, the first one that has an IPv4 address wins.
LAN_IFACE="br0"

# Fixed LAN address to listen on. Leave empty to detect it from LAN_IFACE.
LAN_IP=""

# Country tags for Antiscan addresses. 1 = look them up via ip-api.com (plain HTTP, banned
# addresses leave the router), 0 = off.
GEO=1

# Third-party services: a tab appears once the service's keys are uncommented and filled in, data comes
# within a minute, no restart needed. See "Сторонние сервисы" in the README for where to get the keys.
# The file then holds passwords: chmod 600 /opt/etc/keendash/keendash.conf

# AdGuard Home: web UI address, login and password
#ADGUARD_URL="http://192.168.1.10:3000"
#ADGUARD_USER="admin"
#ADGUARD_PASS=""

# qBittorrent: web UI address, login and password (empty if LAN clients skip the login)
#QBIT_URL="http://192.168.1.10:8080"
#QBIT_USER="admin"
#QBIT_PASS=""

# Plex: address and X-Plex-Token
#PLEX_URL="http://192.168.1.10:32400"
#PLEX_TOKEN=""

# Sonarr, Radarr, Prowlarr, Overseerr: address and API key (Settings -> General)
#SONARR_URL="http://192.168.1.10:8989"
#SONARR_KEY=""
#RADARR_URL="http://192.168.1.10:7878"
#RADARR_KEY=""
#PROWLARR_URL="http://192.168.1.10:9696"
#PROWLARR_KEY=""
#OVERSEERR_URL="http://192.168.1.10:5055"
#OVERSEERR_KEY=""

# Immich: address and an admin API key with server.statistics
#IMMICH_URL="http://192.168.1.10:2283"
#IMMICH_KEY=""

# Web UI links of the "Сервисы" card are detected automatically. Override here, one per line:
#   service=8080                 open http://<router>:8080/
#   service=http://host:1234/x   open a full URL
#   service=-                    no link for this service
#   service=hide                 hide the service from the card
LINKS="
"
